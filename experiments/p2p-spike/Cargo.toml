[package]
name = "p2p-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libp2p = { version = "=0.57.1", default-features = false, features = ["ed25519", "macros", "noise", "ping", "tcp", "tokio", "yamux"] }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
